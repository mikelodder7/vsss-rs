[package]
authors = ["Michael Lodder <redmike7@gmail.com>"]
categories = ["cryptography", "algorithms"]
description = "Verifiable Secret Sharing Schemes for splitting, combining and verifying secret shares"
documentation = "https://docs.rs/vsss-rs"
edition = "2024"
homepage = "https://github.com/mikelodder7/vsss-rs"
keywords = ["crypto", "sharing", "secret", "verifiable"]
license = "Apache-2.0 OR MIT"
name = "vsss-rs"
readme = "README.md"
repository = "https://github.com/mikelodder7/vsss-rs"
version = "6.0.0-rc8"

[features]
default = ["bigint", "curve-serde", "primitive", "random-participant-ids", "std", "zeroize"]
alloc = ["rand/alloc", "serde?/alloc", "crypto-bigint?/alloc", "num?/std", "hex?/alloc", "elliptic-curve-tools?/alloc"]
bigint = ["dep:crypto-bigint", "crypto-bigint/hybrid-array", "crypto-bigint/subtle", "dep:num"]
curve = ["dep:elliptic-curve"]
curve-serde = ["curve", "serde", "dep:elliptic-curve-tools", "elliptic-curve/serde", "elliptic-curve-tools/serde"]
primitive = ["dep:num"]
random-participant-ids = ["dep:sha3", "dep:shake"]
serde = ["dep:serde", "crypto-bigint?/serde", "num?/serde", "generic-array/serde", "hybrid-array/serde"]
std = ["alloc", "num/std", "rand/std", "hex/std", "serde?/std", "elliptic-curve?/std", "elliptic-curve-tools?/std"]
zeroize = ["crypto-bigint?/zeroize", "dep:zeroize"]
legacy-curve-tests = []

[dependencies]
crypto-bigint = { version = "0.7", optional = true }
elliptic-curve = { version = "0.14.0", default-features = false, features = ["arithmetic"], optional = true }
elliptic-curve-tools = { version = "0.3.0", default-features = false, optional = true }
ff = { version = "0.14", default-features = false }
generic-array = "1.4"
hybrid-array = "0.4.13"
num = { version = "0.4", default-features = false, optional = true }
hex = { version = "0.4", default-features = false, optional = true }
rand_core = { version = "0.10", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
subtle = { version = "2.6" }
sha3 = { version = "0.12", default-features = false, optional = true }
shake = { version = "0.1", default-features = false, optional = true }
zeroize = { version = "1", features = ["zeroize_derive"], optional = true }

[dev-dependencies]
bls12_381_plus = { version = "0.9.0-rc1", features = ["expose-fields"] }
ciborium = "0.2.2"
curve25519-dalek = { version = "5.0.0", features = ["digest", "group"] }
ed25519-dalek = "3.0.0"
ed448-goldilocks-plus = "0.18.0"
hex = "0.4"
hash2curve = "0.14"
k256 = { version = "0.14.0", features = ["arithmetic"] }
p256 = { version = "0.14.0", features = ["arithmetic"] }
postcard = { version = "1.0", default-features = false, features = ["use-std"] }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "sys_rng"] }
rand_chacha = "0.10"
rand_xorshift = "0.5"
rstest = { version = "0.26", default-features = false }
serde_bare = "0.5"
serde_cbor_2 = "0.13"
serde_json = "1.0"
sha2 = "0.11"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

[package.metadata.cargo-udeps.ignore]
development = ["bls12_381_plus", "ed448-goldilocks-plus", "hash2curve", "rstest"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
